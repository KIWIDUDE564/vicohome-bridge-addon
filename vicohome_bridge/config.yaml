name: "Vicohome Bridge"
slug: "vicohome_bridge"
version: "2.1.0"
description: "Home Assistant add-on that wraps the vico-cli Vicohome client and publishes events to MQTT with per-camera topics and MQTT discovery."
url: "https://github.com/tomkennedy513/vicohome-bridge-addon"
changelog: "https://github.com/tomkennedy513/vicohome-bridge-addon/blob/main/vicohome_bridge/CHANGELOG.md"

arch:
  - aarch64
  - amd64

init: false
startup: services
boot: auto

services:
  - mqtt:want

options:
  email: ""
  password: ""
  poll_interval: 60
  log_level: "info"
  base_topic: "vicohome"
  bootstrap_history: true
  region: "auto"
  api_base_override: ""
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false

schema:
  email: str
  password: password
  poll_interval: int(5,3600)?
  log_level: list(debug|info|warning|error)?
  base_topic: str?
  bootstrap_history: bool?
  region: list(auto|us|eu)?
  api_base_override: str?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool?
